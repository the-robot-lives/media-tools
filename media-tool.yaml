# media-tool runtime provider/model configuration
#
# Loaded at startup (first match wins, all optional — absent keys fall back to
# compiled-in defaults in src/providers/mod.rs):
#   1. $MEDIA_TOOL_CONFIG        — path to this file OR an http(s) URL
#   2. $MEDIA_TOOL_CONFIG_URL    — http(s) URL (e.g. a gist / S3 / CDN link)
#   3. ./media-tool.yaml         (cwd)
#   4. ~/.config/media-tool/media-tool.yaml
#
# Values below mirror the current compiled-in defaults; edit to tweak without
# rebuilding.

version: 1

# Default model per service (overrides src/providers/mod.rs default_model).
defaults:
  gemini: gemini-3.1-flash-image
  # gemini-chat: gemini-2.5-flash
  # qwen-image: qwen-image-3.0

# Image quality-tier ladders, best-first. Entries are "service:model"
# (bare ids are treated as gemini models). Replaces the built-in ladder
# for that tier entirely when present.
image_tiers:
  low:
    - gemini:gemini-3.1-flash-lite-image
    - gemini:gemini-3.1-flash-image
    - qwen-image:qwen-image-3.0
  medium:
    - gemini:gemini-3.1-flash-image
    - gemini:gemini-3.1-flash-lite-image
    - qwen-image:qwen-image-3.0
  high:
    - gemini:gemini-3-pro-image
    - gemini:gemini-3.1-flash-image
    - qwen-image:qwen-image-3.0-pro

# Chat/text quality-tier ladders, same shape as image_tiers. Drives component,
# react-page, html, style-guide, diagram, document and unrecognised `type:`
# prompts. Replaces the built-in ladder for that tier entirely when present.
chat_tiers:
  low:
    - groq-chat:openai/gpt-oss-120b
  medium:
    - groq-chat:openai/gpt-oss-120b
  high:
    - groq-chat:openai/gpt-oss-120b

# Max prompt chars per service (overrides providers::constraints).
max_prompt_chars:
  gemini: 4000
  suno: 3000
  suno-sfx: 500
  veo: 1000
  grok-video: 1000

# Refine-loop chat model (fallback: src/refine.rs REFINE_MODEL).
refine_model: gemini-3.7-flash

# Per-service prompt-guidance doc, relative to the solutions dir
# (overrides src/fim.rs provider_solution mapping).
prompt_guidance:
  # gemini: providers/gemini-image.md

# ---------------------------------------------------------------------------
# snippets — named house-style prompt fragments (design §4.2)
# ---------------------------------------------------------------------------
# Referenced by name from a `preferences:` rule or from a prompt file's
# `snippets: [name, ...]` key, composed in declared order and prepended to
# `prompt.system`. Commented out by default: an empty library is a no-op.
#
# snippets:
#   house-style: |
#     Clean, confident, understated. No stock-photo gloss, no lens flare.
#   brand-voice: |
#     Dry, precise, never breathless. Understate the claim.

# ---------------------------------------------------------------------------
# preferences — CSS-style cascade (design §4.3)
# ---------------------------------------------------------------------------
# Selector -> overrides. Each matching layer PATCHES per field; it does not
# replace the whole resolved set. Precedence, weakest to strongest:
#
#   0  "*"                          universal
#   1  "type:<t>"                   media type
#   2  "type:<t>[attr=v]", "tag:<t>"  qualified type / tag
#   3  "id:<id>"                    a single prompt
#   4  an explicit field in the .media.prompt file
#   5  a CLI flag (--service / --model / --quality)
#
# Ties at equal specificity go to the LATER rule, as in CSS — so declaration
# order in this file matters. A rule-supplied `service` behaves exactly like an
# inline `service:` field: it PINS the provider and skips the quality ladder.
#
# Attribute selectors match the PRE-cascade prompt: a `quality` the cascade
# itself produced does not feed back into matching. Supported attributes:
# quality, format, service, model, text_format, tag, id.
#
# Run `generate-media-prompt explain <prompt-file>` to see which rule won each
# field and what it beat. A malformed selector is warned about and skipped, not
# fatal.
#
# preferences:
#   "*":
#     service: openai
#     quality: med
#     snippets: [house-style]
#   "type:image":
#     service: grok
#   "type:image[quality=high]":
#     model: imagen-4-ultra
#   "tag:brand":
#     snippets: [house-style, brand-voice]
#   "id:hero-shot":
#     service: grok

# ---------------------------------------------------------------------------
# types — open type registry (design §4.4) — PARSED BUT NOT YET ROUTED
# ---------------------------------------------------------------------------
# Accepted and exposed so a config carrying these round-trips, but nothing
# consumes them yet: registry-driven routing (choke points 5-7) and the
# packaged / per-user `types.d/*.yaml` search path are phase 0c.
#
# types:
#   gcode:
#     modality: text
#     extension: gcode
#     text_format: gcode
#     default_service: anthropic
#     system: "Emit only valid RS-274 G-code. Absolute coords. No commentary."
