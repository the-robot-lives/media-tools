name: Nightly

# Slow tier + release-cache warmer. Releases to main are weeks apart, so buildx
# cache is evicted between them. Schedules run on the default branch (develop),
# whose caches main and PR runs can restore, so this keeps release builds warm.
# Live provider tests (tests/live_qwen_routes.rs) cost API credits and stay manual.

on:
  push:
    branches: [stage]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  rust-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-slow
      - name: Full suite + offline slow tier
        run: |
          cargo test --locked
          cargo test --locked --test slow_provider_http -- --ignored

  warm-docker-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build site image (cache only)
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
