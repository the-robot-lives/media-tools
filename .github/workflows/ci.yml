name: CI

# Marketing site image (context: web/ — Hologram Elixir release).
# PR: Rust crate tests + coverage gate, site ExUnit, docker smoke.
# main: tests gate the image push of sha-*, then bump helm [skip ci].
# develop pushes run the same checks to seed develop-ref caches for feature PRs.
# ArgoCD auto-syncs helm/media-tool-landing @ main.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ops.noizu.com
  IMAGE: ops.noizu.com/media-tool.therobotlives.com/web

jobs:
  # generate-media-prompt crate. `#[ignore]`d tests (live DashScope, ~90s slow HTTP)
  # stay out of acceptance; nightly.yml runs the offline slow one.
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Gate = floor(acceptance line coverage) - 5 (measured 30.15% on 2026-10-07).
      - name: Test + coverage gate
        run: |
          cargo llvm-cov --locked --lcov --output-path lcov.info --fail-under-lines 25
          cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: ignore

  # Site ExUnit. No --cover: Hologram's compiler reads module BEAM files and
  # crashes ({:error, :non_existing}) on cover-compiled modules.
  web-test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "28"
          elixir-version: "1.18.4"
      - uses: actions/cache@v4
        with:
          path: |
            web/deps
            web/_build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('web/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      - run: mix test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # docker-container driver (setup-buildx default) can load AND export gha cache;
      # build-push on main then reuses these layers instead of rebuilding.
      - name: Build site image
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          load: true
          push: false
          tags: media-tool-site:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Probe home page content
        run: |
          docker run -d --name mt-site -p 8132:8132 media-tool-site:ci
          trap 'docker rm -f mt-site >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8132/ | grep -q "Media generation you can commit"; then
              curl -fsS http://127.0.0.1:8132/format | grep -q "The .media.prompt format"
              curl -fsS http://127.0.0.1:8132/providers | grep -q "Provider matrix"
              curl -fsS http://127.0.0.1:8132/extensibility | grep -q "Extend everything"
              curl -fsS http://127.0.0.1:8132/getting-started | grep -q "From zero to generated"
              exit 0
            fi
            sleep 1
          done
          echo "site smoke failed"
          docker logs mt-site || true
          exit 1

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [smoke, rust-test, web-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require registry secrets
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::REGISTRY_USER / REGISTRY_PASSWORD missing on this repo"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build & push site
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  bump-chart:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tag
        run: |
          SHORT=${GITHUB_SHA::7}
          sed -i -E "s|(image: ops\.noizu\.com/media-tool\.therobotlives\.com/web:).*|\1sha-${SHORT}|" helm/media-tool-landing/values.yaml
      - name: Commit & push
        run: |
          git config user.name "media-tool-ci"
          git config user.email "ci@noizu.com"
          git add helm/media-tool-landing/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: deploy sha-${GITHUB_SHA::7} [skip ci]"
          git push
