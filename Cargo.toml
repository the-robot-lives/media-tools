[package]
name = "generate-media-prompt"
version = "0.1.0"
edition = "2021"
description = "Generate media assets from .media.prompt YAML files"

[lib]
name = "media_tool"
path = "src/lib.rs"
# `lib` keeps the CLI binary and the test harness linking the rlib exactly as before;
# `cdylib`/`staticlib` exist for the UniFFI bridge (see `src/ffi.rs`). Swift links the
# staticlib, `uniffi-bindgen --library` reads the cdylib.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "generate-media-prompt"
path = "src/main.rs"

# Binding generator. Not shipped, and feature-gated so a plain `cargo build` never drags
# `uniffi`'s generator into the CLI binary. Kept in-tree so the generator version can never
# drift from the `uniffi` runtime version compiled into the library. Run it via `make ffi`.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
color-eyre = "0.6"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
indicatif = "0.17"
dialoguer = "0.11"
mime_guess = "2"
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
uniffi = { version = "0.32" }
thiserror = "1"

[dev-dependencies]
insta = "1"

[profile.release]
strip = true
lto = true
