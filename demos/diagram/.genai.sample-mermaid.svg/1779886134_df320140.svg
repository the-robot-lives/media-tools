        RD[(Redis<br/>Health: PING)]
    end
    LB -->|health checks| AS1
    LB -->|health checks| AS2
    LB -->|health checks| AS3
    AS1 -->|conn pool| PG
    AS2 -->|conn pool| PG
    AS3 -->|conn pool| PG
    AS1 -->|conn pool| RD
    AS2 -->|conn pool| RD
    AS3 -->|conn pool| RD